[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-evolutionary-search"
version = "0.1.0"
description = "Minimal advisor-worker agent loop for application-agnostic evolutionary search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AES contributors" }]
dependencies = []

[project.optional-dependencies]
"gpu-mode-vectoradd" = ["modal>=1.0.0"]
"math-hexagon-packing" = ["numpy>=1.26", "scipy>=1.11"]
"math-circle-packing" = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
aes = "aes.evolve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aes*"]
