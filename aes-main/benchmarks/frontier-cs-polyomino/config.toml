[run]
name = "frontier-cs-polyomino-gpt55"
# AES makes two top-level agent invocations per iteration (advisor + worker).
iterations = 20
runs_dir = "../../runs"
improvement_tolerance = 0.0

# gpt-5.5 via OpenAI's `codex` CLI in non-interactive (`codex exec`) mode,
# matching the math-hexagon-packing-gpt55 / math-circle-packing-gpt55 jobs.
# Reasoning effort pinned to `medium` to match SkyDiscover's gpt-5.5 config.
[advisor]
command = ["codex", "exec", "--model", "gpt-5.5", "--skip-git-repo-check", "--ephemeral", "--sandbox", "read-only", "-c", "model_reasoning_effort=medium", "-"]
prompt_file = "prompts/advisor.md"
timeout_seconds = 600

[worker]
command = ["codex", "exec", "--model", "gpt-5.5", "--skip-git-repo-check", "--ephemeral", "--sandbox", "workspace-write", "-c", "model_reasoning_effort=medium", "-"]
prompt_file = "prompts/worker.md"
timeout_seconds = 600

[application]
kind = "frontier-cs-polyomino"
workspace = "workspace"
editable_files = ["submission.cpp"]
# Evaluation runs in SkyDiscover's uv env (frontier-cs extra) so the Frontier-CS
# evaluator + frontier_cs package and the Docker judge at :8081 are available.
evaluation_command = ["uv", "run", "--project", "/Users/sherryruan/github/skydiscover", "--extra", "frontier-cs", "python", "aes_evaluate.py", "submission.cpp"]
metric_pattern = 'combined_score:\s*([0-9.]+)'
metric_group = 1
direction = "maximize"
# Compile + 70 judged cases (n up to 1e4, 2s/case); allow generous margin.
evaluation_timeout_seconds = 900

[application.environment]
FRONTIER_CS_PROBLEM = "0"
JUDGE_URLS = "http://localhost:8081"
FRONTIER_CS_SRC = "/Users/sherryruan/github/skydiscover/benchmarks/frontier-cs-eval/Frontier-CS/src"
PYTHONDONTWRITEBYTECODE = "1"
