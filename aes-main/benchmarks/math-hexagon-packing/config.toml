[run]
name = "math-hexagon-packing-gpt55"
# AES makes two top-level agent invocations per iteration (advisor + worker).
iterations = 20
runs_dir = "../../runs"
improvement_tolerance = 0.0

# NOTE: gpt-5.5 is driven through OpenAI's `codex` CLI in non-interactive
# (`codex exec`) mode. These command arrays are the integration point; once
# `codex` is installed, `aes validate` + a one-iteration smoke test confirm the
# exact flag set for the installed version. Reasoning effort is pinned to
# `medium` to match SkyDiscover's gpt-5.5 configuration.
[advisor]
command = ["codex", "exec", "--model", "gpt-5.5", "--skip-git-repo-check", "--ephemeral", "--sandbox", "read-only", "-c", "model_reasoning_effort=medium", "-"]
prompt_file = "prompts/advisor.md"
timeout_seconds = 600

[worker]
command = ["codex", "exec", "--model", "gpt-5.5", "--skip-git-repo-check", "--ephemeral", "--sandbox", "workspace-write", "-c", "model_reasoning_effort=medium", "-"]
prompt_file = "prompts/worker.md"
timeout_seconds = 600

[application]
kind = "math-hexagon-packing"
workspace = "workspace"
editable_files = ["submission.py"]
evaluation_command = ["uv", "run", "--extra", "math-hexagon-packing", "python", "-I", "evaluate.py", "submission.py"]
metric_pattern = 'combined_score:\s*([0-9.]+)'
metric_group = 1
direction = "maximize"
# Candidate execution is capped at 600s inside evaluate.py; allow wrapper margin.
evaluation_timeout_seconds = 660

[application.environment]
PYTHONDONTWRITEBYTECODE = "1"
